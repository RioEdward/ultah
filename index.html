<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Surat Untuk Pacarku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: satu layar penuh per halaman. Cover amplop hati -> menu 4 amplop hati kecil -> halaman isi. Satu tampilan ungu-pink-putih yang sengaja tidak ikut mode gelap. */
:root{
  --white:#ffffff;
  --blush:#ffe1ef;
  --pink:#ff7eb6;
  --lilac:#c9b2f5;
  --violet:#7b4bd6;
  --ink:#43266f;
  --ink-soft:#7a5fa6;
  --font-script:"Parisienne","Snell Roundhand",cursive;
  --font-body:"Quicksand","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:linear-gradient(165deg,#fffafd 0%,#f5eaff 45%,#ffe3f1 100%) fixed;
  background-color:var(--white);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:12px}

.app{position:relative;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;animation:fadeIn .6s ease both;min-width:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* hati melayang */
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float i{position:absolute;bottom:-40px;width:var(--s);height:var(--s);background:var(--c);opacity:.35;
  clip-path:path("M12 22 C4 15 0 11 0 6.500 C0 2.500 3 0 6.500 0 C9 0 11 1.500 12 3.500 C13 1.500 15 0 17.500 0 C21 0 24 2.500 24 6.500 C24 11 20 15 12 22Z");
  transform-origin:0 100%;animation:rise var(--d) linear infinite;animation-delay:var(--l)}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg) scale(var(--k,1));opacity:0}}
.app{z-index:1}

h1,h2{font-family:var(--font-script);font-weight:400;margin:0;line-height:1.15;text-wrap:balance;color:var(--violet)}
h1{font-size:clamp(2.6rem,12vw,3.6rem)}
h2{font-size:clamp(2.2rem,9vw,2.8rem)}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:0}
.hint{color:var(--ink-soft);font-size:.95rem;margin:0}

/* ===== COVER ===== */
.cover{justify-content:center;gap:10px;text-align:center;padding-block:24px}
.env{position:relative;width:min(300px,78vw);aspect-ratio:100/90;margin:28px 0 18px;display:block;filter:drop-shadow(0 18px 24px rgba(123,75,214,.28));animation:beat 2.2s ease-in-out infinite}
.env svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;transition:transform .7s ease,opacity .6s ease .5s}
.env .paper{position:absolute;left:19%;right:19%;top:18%;bottom:30%;background:var(--white);border-radius:10px;z-index:1;
  display:grid;place-items:center;font-family:var(--font-script);font-size:1.7rem;color:var(--pink);
  transition:transform .9s cubic-bezier(.3,1.4,.5,1) .15s;box-shadow:0 2px 10px rgba(123,75,214,.2)}
.env.open{animation:none}
.env.open .paper{transform:translateY(-62%) rotate(-3deg)}
.env.open svg{transform:scale(1.08) translateY(12%);opacity:0}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.tap{margin-top:6px;padding:12px 26px;border-radius:999px;background:var(--violet);color:var(--white);font-weight:700;letter-spacing:.04em;box-shadow:0 8px 18px rgba(123,75,214,.35)}

/* ===== MENU ===== */
.menu{gap:8px;text-align:center;padding-block:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;width:100%;margin:18px 0 10px}
.mini{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:6px;border-radius:20px;transition:transform .25s}
.mini:hover{transform:translateY(-4px) rotate(-1.5deg)}
.mini:active{transform:scale(.96)}
.mini .heart{position:relative;width:min(140px,36vw);aspect-ratio:100/90;filter:drop-shadow(0 10px 14px rgba(123,75,214,.25))}
.mini svg{width:100%;height:100%;overflow:visible;display:block}
.mini b{font-weight:700;font-size:1rem}
.mini small{color:var(--ink-soft);font-size:.82rem}
.mini .done{position:absolute;top:2px;right:18%;width:26px;height:26px;border-radius:50%;background:var(--white);color:var(--violet);display:none;place-items:center;font-size:.9rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mini.seen .done{display:grid}

/* ===== PAGE SHELL ===== */
.page{gap:18px;padding-block:8px 24px;width:100%}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:var(--white);color:var(--violet);font-weight:700;font-size:.9rem;box-shadow:0 4px 12px rgba(123,75,214,.15)}
.heading{text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}

/* surat */
.letter{width:100%;background:var(--white);border-radius:22px 22px 22px 6px;padding:26px 24px 24px;box-shadow:0 14px 34px rgba(123,75,214,.18);position:relative;
  background-image:repeating-linear-gradient(transparent 0 31px,#f1e7ff 31px 32px);background-position:0 20px}
.letter p{margin:0 0 16px;line-height:32px}
.letter .to{font-family:var(--font-script);font-size:1.9rem;color:var(--pink);line-height:40px}
.letter .sign{font-family:var(--font-script);font-size:1.8rem;color:var(--violet);text-align:right;margin:8px 0 0;line-height:40px}

/* foto */
.stage{width:100%;overflow:hidden;border-radius:18px;touch-action:pan-y}
.track{display:flex;transition:transform .5s cubic-bezier(.4,.1,.2,1)}
.slide{flex:0 0 100%;min-width:0;padding:10px 14px 6px;display:flex;justify-content:center}
.polaroid{width:100%;max-width:340px;background:var(--white);padding:12px 12px 16px;border-radius:6px;box-shadow:0 14px 30px rgba(123,75,214,.22);transform:rotate(var(--r,-2deg))}
.photo{aspect-ratio:4/5;width:100%;border-radius:3px;background:linear-gradient(145deg,var(--blush),#e9ddff);display:grid;place-items:center;overflow:hidden;text-align:center;color:var(--ink-soft);font-size:.9rem;padding:16px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:56px;height:auto;display:block;margin:0 auto 8px;opacity:.7}
.cap{margin:12px 4px 0;text-align:center;font-family:"Quicksand","Trebuchet MS",system-ui,sans-serif;font-size:1.1rem;font-weight:600;line-height:1.4;color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:14px}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--violet);color:var(--white);display:grid;place-items:center;font-size:1.2rem;box-shadow:0 6px 14px rgba(123,75,214,.35)}
.arrow:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--lilac);transition:all .3s}
.dots i.on{background:var(--pink);width:24px;border-radius:6px}

/* alasan */
.hearts17{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.n{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--white);color:var(--violet);font-weight:700;box-shadow:0 4px 10px rgba(123,75,214,.14);transition:all .2s}
.n:hover{transform:translateY(-2px)}
.n.seen{background:var(--lilac);color:var(--white)}
.n.on{background:var(--pink);color:var(--white);transform:scale(1.08)}
.reason{width:100%;min-height:150px;background:var(--white);border-radius:22px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px;box-shadow:0 14px 30px rgba(123,75,214,.18)}
.reason .no{font-family:var(--font-script);font-size:2.6rem;color:var(--pink);line-height:1}
.reason p{margin:0;font-size:1.08rem;font-weight:500;text-wrap:pretty}
.progress{color:var(--ink-soft);font-size:.9rem;margin:0}

/* kue */
.cake{width:min(260px,70vw);margin-top:6px}
.cake svg{width:100%;height:auto;display:block;overflow:visible}
.flame{transform-origin:50% 100%;animation:flick 1s ease-in-out infinite alternate;transition:opacity .4s,transform .4s}
.out .flame{opacity:0;transform:scale(.2);animation:none}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12,1.2) rotate(3deg)}}
.wish{opacity:0;transform:translateY(10px);transition:all .7s ease .3s;text-align:center;background:var(--white);border-radius:22px;padding:22px 20px;box-shadow:0 14px 30px rgba(123,75,214,.18);width:100%}
.wish p{margin:0 0 10px;text-wrap:pretty}
.wish .big{font-family:var(--font-script);font-size:2rem;color:var(--violet);line-height:1.2}
.out .wish{opacity:1;transform:none}
.cta{padding:12px 26px;border-radius:999px;background:var(--pink);color:var(--white);font-weight:700;box-shadow:0 8px 18px rgba(255,126,182,.4)}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-30px;left:var(--x);width:var(--s);height:var(--s);background:var(--c);
  clip-path:path("M12 22 C4 15 0 11 0 6.500 C0 2.500 3 0 6.500 0 C9 0 11 1.500 12 3.500 C13 1.500 15 0 17.500 0 C21 0 24 2.500 24 6.500 C24 11 20 15 12 22Z");
  animation:fall var(--d) ease-in forwards;animation-delay:var(--l)}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--rot))}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .float{display:none}
}
</style>

</head>
<body>
<div class="float" id="float" aria-hidden="true"></div>

<main class="app" id="app"></main>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* ========= EDIT BAGIAN INI ========= */
const NAMA = "Caca";
const DARI = "ioo yangg selaluu sayangg dedee lovee uuu";

/* Foto: isi src dengan foto kalian. Kosong = tampil bingkai kosong. */
const FOTO = [
  { src:"1.jpg", cap:"Awal kita ketemu sehabis lebaran, aku ga nyangka bisa sampe di titik ini" },
  { src:"2.jpg", cap:"Ini foto yang aku suka banget" },
  { src:"3.jpg", cap:"Hari-hari biasa yang menjadi spesial semenjak ada kamu" },
  { src:"4.jpg", cap:"Semoga masi banyak foto kita berikutnya ia sayang" },
  { src:"5.jpg", cap:"AKUU SAYANGG KAMUU BANGETTT TAUUU" }
];

const SURAT = [
  "Selamat ulang tahun sayangku yang ke-17 tahun, cie yang uda 17 tahun, aku bersyukur banget bisa jadi salah satu orang yang ada di cerita dede.",
  "Makasi iaa udaa sabarr samaa aku, udaa dengerin cerita aku yang kadang nda penting, dan udah bikin hari-hariku jadi jauh lebih berwarna.",
  "Aku doain kamu sehat selalu ia sayang, bahagia terus, dan semua mimpi kamu pelan-pelan jadi nyata. Kalau lagi cape, inget aja ada aku yang siap dengerin kamu terus sayang.",
  "Semoga umur 17 tahun ini dede ngerasa awal yang seru iaa, aku pengen ada disana buat lihat dede tumbuh jadi versi terbaik darimu."
];

const ALASAN = [
  "Senyumm dede bikinn atuu senengg",
  "Dedee baikk kaloo adaa uangg selaluu ingett olangg sekitall dedee",
  "Ketawaanaa bikinn tanenn",
  "Dedee selaluu bikinn atuu ngelasaaa disayanggg banett",
  "Calaa dedee peduyii samaa hall kecill tentangg atuu",
  "Dedee pintell dann ndaa sadall kaloo dedee pintell",
  "Dedeee ucuu banett kaloo agii ngambekk",
  "Dedee selaluu saball samaa atuu yangg kadangg ngeyesinn",
  "Sualaa dedee bikinn tenanggg, bikinn tanenn, bikinn sayanggg",
  "Belanii jadii dilii sendiyiii",
  "Dedeee selaluu mauu belubaa kaloo atuu ngelasaaa dedee masii sifattna kulangg baikk",
  "Dedee selaluu baikk samaaa siapapunn walaupunn kadangg olangg jahatt samaaa dedee",
  "Dedeee bikinn hall sepelee jadii behalgaa bagiii atuuu",
  "Dedeee pedengalll yangg baikkk",
  "Dedee ituu cantikkk luall dalammm",
  "Dedeee bikinn atuuu pengenn jadii olangg yanggg lebihhh baikkk dalii sebeyummnaa.",
  "Kalenaa dedee atuuu jadii makinn sayangg samaa dedeeeee"
];

const DOA = "Semogaa dii umurr 17 tahunn inii, dedee selaluu dikelilingii olehh orang orangg yang sayangg samaa dedee iaa cantikk, dikasii rezekii yangg melimpahh, dann semuaa doaa yangg baik dikabulkann";
/* ========= BATAS EDIT ========= */

const $ = (s, r=document) => r.querySelector(s);
const app = $("#app");
const HEART = "M50 88 C20 62 2 44 2 26 C2 12 13 2 27 2 C38 2 46 8 50 16 C54 8 62 2 73 2 C87 2 98 12 98 26 C98 44 80 62 50 88Z";
let gid = 0;
function heartSVG(c1, c2, seal){
  const id = "g" + (++gid);
  return `<svg viewBox="0 0 100 90" aria-hidden="true"><defs>
    <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="${HEART}" fill="url(#${id})"/>
    <path d="M9 22 L50 54 L91 22" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M18 56 L42 40 M82 56 L58 40" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
    <g transform="translate(50 54) scale(${seal}) translate(-12 -11)"><path d="M12 22 C4 15 0 11 0 6.500 C0 2.500 3 0 6.500 0 C9 0 11 1.500 12 3.500 C13 1.500 15 0 17.500 0 C21 0 24 2.500 24 6.500 C24 11 20 15 12 22Z" fill="#fff"/></g>
  </svg>`;
}
const seenMenu = new Set();

/* ---------- COVER ---------- */
function cover(){
  app.innerHTML = `<section class="screen cover">
    <p class="eyebrow">Happy Birthday</p>
    <h1>Selamat 17 Tahun, ${esc(NAMA)}</h1>
    <button class="env" id="env" aria-label="Buka amplop">
      <span class="paper">I love you</span>
      ${heartSVG("#ff8cc2","#8d5be0", 0.9)}
    </button>
    <button class="tap" id="tap">Buka amplopnya</button>
    <p class="hint">Ada surat kecil di dalamnya</p>
  </section>`;
  const open = () => {
    const env = $("#env"); if(env.classList.contains("open")) return;
    env.classList.add("open"); $("#tap").disabled = true;
    burst(26);
    setTimeout(menu, 1700);
  };
  $("#env").onclick = open; $("#tap").onclick = open;
}

/* ---------- MENU ---------- */
const ITEMS = [
  { id:"surat",   t:"Surat untukmu",  s:"baca pelan-pelan", c:["#ff8cc2","#d46ae0"], fn:pageSurat },
  { id:"foto",    t:"Kenangan kita",  s:"foto-foto kita",   c:["#c9a6f7","#8d5be0"], fn:pageFoto },
  { id:"alasan",  t:"17 alasan",      s:"kenapa aku sayang",c:["#ff9fc8","#ff6fa8"], fn:pageAlasan },
  { id:"kue",     t:"Kado terakhir",  s:"tiup lilinnya",    c:["#b7a0f5","#ff8cc2"], fn:pageKue }
];
function menu(){
  app.innerHTML = `<section class="screen menu">
    <p class="eyebrow">Pilih satu amplop</p>
    <h2>Ada 4 pesan buat ${esc(NAMA)}</h2>
    <div class="grid">${ITEMS.map(i=>`
      <button class="mini ${seenMenu.has(i.id)?"seen":""}" data-id="${i.id}">
        <span class="heart">${heartSVG(i.c[0], i.c[1], .55)}<span class="done">&#10003;</span></span>
        <b>${i.t}</b><small>${i.s}</small>
      </button>`).join("")}
    </div>
    <p class="hint">Tekan amplopnya untuk membuka</p>
  </section>`;
  app.querySelectorAll(".mini").forEach(b => b.onclick = () => {
    const it = ITEMS.find(x => x.id === b.dataset.id);
    seenMenu.add(it.id); it.fn(); window.scrollTo({top:0});
  });
}
function shell(title, eyebrow, inner){
  app.innerHTML = `<section class="screen page">
    <div class="top"><button class="back" id="back">&larr; Kembali</button></div>
    <div class="heading"><p class="eyebrow">${eyebrow}</p><h2>${title}</h2></div>
    ${inner}
  </section>`;
  $("#back").onclick = () => { menu(); window.scrollTo({top:0}); };
}

/* ---------- SURAT ---------- */
function pageSurat(){
  shell("Surat untukmu","dari hati",
    `<article class="letter">
      <p class="to">Untuk ${esc(NAMA)},</p>
      ${SURAT.map(p=>`<p>${esc(p)}</p>`).join("")}
      <p class="sign">${esc(DARI)}</p>
    </article>`);
}

/* ---------- FOTO ---------- */
function pageFoto(){
  const slides = FOTO.map((f,i)=>`<div class="slide"><figure class="polaroid" style="--r:${i%2?2:-2}deg;margin:0">
      <div class="photo">${f.src ? `<img src="${f.src}" alt="${esc(f.cap)}">` :
        `<div><svg viewBox="0 0 100 90"><path d="${HEART}" fill="#c9b2f5"/></svg>Foto kita #${i+1}</div>`}</div>
      <figcaption class="cap">${esc(f.cap)}</figcaption></figure></div>`).join("");
  shell("Kenangan kita","geser atau tekan panah",
    `<div class="stage" id="stage"><div class="track" id="track">${slides}</div></div>
     <div class="ctrl"><button class="arrow" id="prev" aria-label="Sebelumnya">&larr;</button>
       <div class="dots" id="dots">${FOTO.map(()=>"<i></i>").join("")}</div>
       <button class="arrow" id="next" aria-label="Berikutnya">&rarr;</button></div>`);
  let i = 0; const n = FOTO.length;
  const go = k => { i = Math.max(0, Math.min(n-1, k));
    $("#track").style.transform = `translateX(${-i*100}%)`;
    $("#prev").disabled = i===0; $("#next").disabled = i===n-1;
    [...$("#dots").children].forEach((d,j)=>d.classList.toggle("on", j===i)); };
  $("#prev").onclick = () => go(i-1); $("#next").onclick = () => go(i+1);
  let x0 = null; const st = $("#stage");
  st.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
  st.addEventListener("touchend", e => { if(x0===null) return; const dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 40) go(i + (dx<0?1:-1)); x0 = null; });
  if(n===1) $(".ctrl").style.display = "none";
  go(0);
}

/* ---------- 17 ALASAN ---------- */
function pageAlasan(){
  shell("17 alasan","satu alasan untuk tiap tahun",
    `<div class="reason" id="reason" aria-live="polite"><span class="no">&hearts;</span><p>Tekan angkanya satu per satu ya</p></div>
     <div class="hearts17" id="nums">${ALASAN.map((_,k)=>`<button class="n" aria-label="Alasan ke-${k+1}">${k+1}</button>`).join("")}</div>
     <p class="progress" id="prog">Dibuka 0 dari 17</p>`);
  const seen = new Set(); const btns = [...$("#nums").children];
  btns.forEach((b,k)=> b.onclick = () => {
    btns.forEach(x=>x.classList.remove("on")); b.classList.add("on","seen"); seen.add(k);
    $("#reason").innerHTML = `<span class="no">${k+1}</span><p>${esc(ALASAN[k])}</p>`;
    $("#prog").textContent = seen.size === 17 ? "Semua sudah dibuka. Masih banyak lagi yang belum sempat aku tulis." : `Dibuka ${seen.size} dari 17`;
    if(seen.size === 17) burst(30);
  });
}

/* ---------- KUE ---------- */
function pageKue(){
  $("#app").classList.remove("out");
  shell("Kado terakhir","buat permintaan dulu",
    `<div class="cake" id="cake"><svg viewBox="0 0 200 190" aria-label="Kue ulang tahun dengan lilin 17">
      <ellipse cx="100" cy="176" rx="90" ry="9" fill="#7b4bd6" opacity=".15"/>
      <rect x="22" y="112" width="156" height="60" rx="14" fill="#c9b2f5"/>
      <rect x="40" y="76" width="120" height="44" rx="12" fill="#ffd1e6"/>
      <path d="M40 98 q10 14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 v-8 h-120z" fill="#fff"/>
      <path d="M22 134 q13 16 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 v-12 h-156z" fill="#fff"/>
      <rect x="86" y="38" width="28" height="42" rx="6" fill="#ff7eb6"/>
      <text x="100" y="66" text-anchor="middle" font-family="Quicksand,sans-serif" font-weight="700" font-size="17" fill="#fff">17</text>
      <g class="flame"><path d="M100 4 C112 18 112 30 100 36 C88 30 88 18 100 4Z" fill="#ffb347"/><path d="M100 16 C106 24 106 30 100 34 C94 30 94 24 100 16Z" fill="#fff4c2"/></g>
    </svg></div>
    <button class="cta" id="blow">Tiup lilinnya</button>
    <div class="wish"><p class="big">Selamat ulang tahun, ${esc(NAMA)}</p><p>${esc(DOA)}</p><p class="big">I love you, sampai kapan pun.</p></div>`);
  $("#blow").onclick = () => { $("#app").classList.add("out"); $("#cake").classList.add("out");
    $(".wish").parentElement.classList.add("out"); $(".wish").style.opacity = 1; $(".wish").style.transform = "none";
    $("#blow").hidden = true; burst(60); };
}

/* ---------- util ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const COLORS = ["#ff7eb6","#c9b2f5","#7b4bd6","#ffd1e6","#ff9fc8"];
function burst(n){
  const box = $("#confetti");
  for(let i=0;i<n;i++){
    const el = document.createElement("i"), s = 12 + Math.random()*20;
    el.style.cssText = `--x:${Math.random()*100}%;--s:${s}px;--c:${COLORS[i%COLORS.length]};--d:${2.4+Math.random()*2}s;--l:${Math.random()*.7}s;--rot:${(Math.random()*720-360)|0}deg`;
    box.appendChild(el); setTimeout(()=>el.remove(), 5500);
  }
}
(function bg(){
  const f = $("#float");
  for(let i=0;i<12;i++){
    const el = document.createElement("i");
    el.style.cssText = `left:${Math.random()*100}%;--s:${14+Math.random()*22}px;--c:${COLORS[i%COLORS.length]};--d:${11+Math.random()*10}s;--l:${-Math.random()*16}s;--k:${.8+Math.random()*.6}`;
    f.appendChild(el);
  }
})();
cover();
</script>
